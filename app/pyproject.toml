[project]
name = "altruagent-pokemon-bot"
version = "1.0.0"
description = "Local draft, lineup and doubles battle agent for AltruAgent Pokemon VGC."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "mcp>=1.12.0,<2.0.0",  # 2.x renames streamablehttp_client -> streamable_http_client;
                           # pinned to the 1.x line to match Agent_ACP's own gameapi
                           # dependency (mcp>=1.12.0, 1.28.1 actually installed there)
                           # and its scripts' exact import names.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["altruagent*", "agent*", "pokemon_bot*"]

[tool.setuptools.package-data]
pokemon_bot = ["dex_data.json"]
